name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14.9"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run full test suite
        run: python -m pytest tests -q

      - name: Scan application with Bandit
        run: python -m bandit -r app

      - name: Audit installed Python dependencies
        run: python -m pip_audit

      - name: Scan repository files for secrets
        run: |
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --redact --exit-code 1

      - name: Build application image
        run: docker build -t revolut-fintech-api:ci .

      - name: Export image for scanning
        run: docker save -o "$RUNNER_TEMP/revolut-fintech-api.tar" revolut-fintech-api:ci

      - name: Scan container vulnerabilities
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP:/scan:ro" \
            aquasec/trivy:0.76.1 \
            image --input /scan/revolut-fintech-api.tar \
            --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --timeout 5m
